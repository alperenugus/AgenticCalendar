spring:
  application:
    name: appointmentscheduler
  
  datasource:
    url: jdbc:postgresql://localhost:5432/appointmentscheduler
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # Spring AI Configuration
  ai:
    # OpenAI Configuration (uncomment if you want to use OpenAI instead)
    # openai:
    #   api-key: ${OPENAI_API_KEY}
    #   chat:
    #     options:
    #       model: gpt-4o-mini
    #       temperature: 0.7
    
    # Ollama Configuration (for local use - FREE and OPEN SOURCE)
    # IMPORTANT: Use llama3.1 (or mistral) - they support tool calling
    # llama3.2 does NOT support tool calling
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1  # Use llama3.1 - it supports tool calling!
          temperature: 0.7

# Server Configuration
server:
  port: 8080

# Logging
logging:
  level:
    com.agent.appointmentscheduler: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.ai.ollama: DEBUG  # Detailed Ollama logging
    org.springframework.ai.chat.client: DEBUG  # ChatClient logging
    org.hibernate.SQL: DEBUG

