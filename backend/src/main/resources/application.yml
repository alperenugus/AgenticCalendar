spring:
  application:
    name: appointmentscheduler
  
  datasource:
    url: jdbc:postgresql://localhost:5432/appointmentscheduler
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  
  # LangChain4j Configuration
  # LangChain4j is the industry standard for Java LLM applications
  langchain4j:
    ollama:
      base-url: http://localhost:11434
      model: llama3.1  # Use llama3.1 - it supports tool calling!
      temperature: 0.7

# Server Configuration
server:
  port: 8080

# Logging
logging:
  level:
    com.agent.appointmentscheduler: DEBUG
    dev.langchain4j: DEBUG  # LangChain4j logging
    dev.langchain4j.model.ollama: DEBUG  # Detailed Ollama logging
    org.hibernate.SQL: WARN  # Disable SQL query logging

