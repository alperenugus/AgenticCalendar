spring:
  application:
    name: appointmentscheduler
  
  datasource:
    # Railway PostgreSQL - uses environment variables automatically set by Railway
    # Railway sets: PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:appointmentscheduler}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  
  # OAuth2 Google Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            redirect-uri-template: ${GOOGLE_REDIRECT_URI:https://agenticappointmentschedulerbackend-production.up.railway.app/login/oauth2/code/{registrationId}}
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
  
  # LangChain4j Configuration
  # LangChain4j is the industry standard for Java LLM applications
  langchain4j:
    # Provider selection: "groq" is default (free tier: 14,400 requests/day)
    # Set LANGCHAIN4J_PROVIDER=ollama to use local Ollama instead
    provider: groq  # Default to Groq (works both locally and on Railway)
    
    # Groq Configuration (FREE tier: 100,000 tokens/day)
    # Get API key: https://console.groq.com/keys
    # Set LANGCHAIN4J_GROQ_API_KEY environment variable
    groq:
      api-key: ${LANGCHAIN4J_GROQ_API_KEY:}
      # Using smaller model to reduce token usage and avoid rate limits
      # llama-3.1-8b-instant: Fast, efficient, uses ~10x fewer tokens than 70b models
      # llama-3.3-70b-versatile: More capable but uses many more tokens (may hit rate limits)
      model: llama-3.1-8b-instant  # Switched to smaller model to avoid rate limits
      # Alternative models: llama-3.3-70b-versatile (more capable but token-heavy), mixtral-8x7b-32768
      temperature: 0.7
    
    # Ollama Configuration (for local development - optional)
    # To use Ollama, set LANGCHAIN4J_PROVIDER=ollama and run: docker run -d -p 11434:11434 ollama/ollama
    ollama:
      base-url: http://localhost:11434
      model: llama3.1  # Use llama3.1 - it supports tool calling!
      temperature: 0.7

# Server Configuration
server:
  port: ${PORT:8080}  # Use PORT env var for Railway, default to 8080
  # Trust proxy headers (required for Railway/HTTPS)
  forward-headers-strategy: framework
  use-forward-headers: true
  # Ensure redirect URIs use HTTPS when behind proxy
  tomcat:
    remote-ip-header: x-forwarded-for
    protocol-header: x-forwarded-proto

# Rate Limiting Configuration
rate-limit:
  # Per-session rate limits (using token bucket algorithm)
  chat:
    # Maximum number of requests allowed
    capacity: ${RATE_LIMIT_CAPACITY:20}
    # Number of tokens to refill per period
    refill-tokens: ${RATE_LIMIT_REFILL:10}
    # Refill period in seconds
    refill-period-seconds: ${RATE_LIMIT_PERIOD:60}
  # History endpoint is less resource-intensive, so higher limits
  history:
    capacity: ${RATE_LIMIT_HISTORY_CAPACITY:60}
    refill-tokens: ${RATE_LIMIT_HISTORY_REFILL:30}
    refill-period-seconds: ${RATE_LIMIT_HISTORY_PERIOD:60}

# Logging
logging:
  level:
    com.agent.appointmentscheduler: DEBUG
    dev.langchain4j: DEBUG  # LangChain4j logging
    dev.langchain4j.model.ollama: DEBUG  # Detailed Ollama logging
    org.hibernate.SQL: WARN  # Disable SQL query logging

